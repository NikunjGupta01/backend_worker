version: "3.9"

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synquerra_backend_worker
    env_file:
      - .env
    volumes:
      - ./:/opt
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017}
      MONGO_DB: ${MONGO_DB:-synquerra_db}
      IMEIS: ${IMEIS:-}
    command: python main.py
    # depends_on:
    #   - mqtt
    restart: unless-stopped

  # mqtt:
